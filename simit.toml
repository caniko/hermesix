[ci]
runner = "ubuntu-24.04"
runtime = "nix"
step_runners = { cargo-clippy = "ubuntu-24.04", cargo-doc = "ubuntu-24.04", cargo-fmt = "ubuntu-24.04", cargo-package = "ubuntu-24.04", cargo-test = "ubuntu-24.04", nix-check = "ubuntu-24.04", quality-tools = "ubuntu-24.04" }
provider = "actions"
platform = "github"
required_gates = [{ id = "harbor-ci", run = "nix develop -c harbor-ci full" }]
publish_crates = true
all_features = false
nix_builds = [".#packages.x86_64-linux.hermesix"]

[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"
system_runners = { x86_64-linux = "ubuntu-24.04" }

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "hermesix"
token_secret = "ATTIC_TOKEN"

[ci.pages]
repo = "caniko/hermesix"
canonical_domain = "hermesix.tartanoglu.com"
